# Code generation for shared_models: freezed for the entities, json_serializable for
# their snake_case JSON. `checked: true` wraps a bad field in a CheckedFromJsonException
# naming the key. Regenerate with `dart run build_runner build --delete-conflicting-outputs`
# in this package; the generated files are committed.
targets:
  $default:
    builders:
      json_serializable:
        options:
          field_rename: snake
          explicit_to_json: true
          checked: true
