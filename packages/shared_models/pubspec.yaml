name: shared_models
description: Models shared by the Finance Tracker app and server.
publish_to: none

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  freezed_annotation: 3.1.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  meta: ^1.16.0

dev_dependencies:
  build_runner: 2.16.1
  freezed: 4.0.1
  json_serializable: ">=6.14.1 <6.15.0"
  lints: ^6.1.0
  # json_serializable 6.14.x does not compile against source_helper 1.4.0 (both define
  # toStringNonNullable on DartType); hold it below 1.4 until the band moves.
  source_helper: ">=1.3.13 <1.4.0"
  test: ^1.31.1
