    # Investments ----------------------------------------------------------------------------
    HoldingsResponse:
      type: object
      required: [holdings, securities]
      properties:
        holdings:
          type: array
          items:
            $ref: '#/components/schemas/Holding'
        securities:
          type: array
          items:
            $ref: '#/components/schemas/Security'
    Holding:
      type: object
      description: >-
        A position in one security. `quantity` and `institution_price` are `Decimal`;
        `institution_value` and `cost_basis` are totals in `currency_code`.
      required:
        - account_id
        - security_id
        - quantity
        - institution_price
        - institution_price_as_of
        - institution_value
        - cost_basis
        - currency_code
      properties:
        account_id:
          type: string
        security_id:
          type: string
        quantity:
          $ref: '#/components/schemas/Decimal'
        institution_price:
          $ref: '#/components/schemas/Decimal'
        institution_price_as_of:
          type: string
          format: date
          nullable: true
        institution_value:
          $ref: '#/components/schemas/Money'
        cost_basis:
          allOf:
            - $ref: '#/components/schemas/Money'
          nullable: true
        currency_code:
          type: string
          pattern: '^[A-Z]{3}$'
      example:
        account_id: acc-5
        security_id: sec-1
        quantity: '10.5'
        institution_price: '42.1234'
        institution_price_as_of: '2026-10-23'
        institution_value:
          minor_units: 44230
          currency: USD
        cost_basis:
          minor_units: 40000
          currency: USD
        currency_code: USD
    Security:
      type: object
      required:
        - id
        - name
        - ticker_symbol
        - type
        - is_cash_equivalent
        - close_price
        - close_price_as_of
        - currency_code
      properties:
        id:
          type: string
        name:
          type: string
          nullable: true
        ticker_symbol:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
          description: Plaid's security type, kept open (`equity`, `etf`, `mutual fund`, `cash`, ...)
        is_cash_equivalent:
          type: boolean
          nullable: true
        close_price:
          allOf:
            - $ref: '#/components/schemas/Decimal'
          nullable: true
        close_price_as_of:
          type: string
          format: date
          nullable: true
        currency_code:
          type: string
          pattern: '^[A-Z]{3}$'
      example:
        id: sec-1
        name: Vanguard Total Stock Market ETF
        ticker_symbol: VTI
        type: etf
        is_cash_equivalent: false
        close_price: '42.1234'
        close_price_as_of: '2026-10-23'
        currency_code: USD
    InvestmentTransaction:
      type: object
      description: >-
        A buy, sell, dividend, fee or transfer in an investment account. `amount` follows
        our sign (negative is an outflow from the account); `quantity` and `price` are
        `Decimal`. `deleted_at` is the tombstone.
      required:
        - id
        - account_id
        - security_id
        - date
        - name
        - type
        - subtype
        - quantity
        - price
        - amount
        - fees
        - deleted_at
        - sync_version
      properties:
        id:
          type: string
          readOnly: true
        account_id:
          type: string
        security_id:
          type: string
          nullable: true
        date:
          type: string
          format: date
        name:
          type: string
        type:
          type: string
          description: Plaid's type, kept open (`buy`, `sell`, `cancel`, `cash`, `fee`, `transfer`)
        subtype:
          type: string
          nullable: true
        quantity:
          $ref: '#/components/schemas/Decimal'
        price:
          $ref: '#/components/schemas/Decimal'
        amount:
          $ref: '#/components/schemas/Money'
        fees:
          allOf:
            - $ref: '#/components/schemas/Money'
          nullable: true
        deleted_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$'
          nullable: true
        sync_version:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
      example:
        id: inv-txn-1
        account_id: acc-5
        security_id: sec-1
        date: '2026-10-20'
        name: BUY Vanguard Total Stock Market ETF
        type: buy
        subtype: buy
        quantity: '2'
        price: '41.50'
        amount:
          minor_units: -8300
          currency: USD
        fees: null
        deleted_at: null
        sync_version: 43
    InvestmentTransactionPage:
      type: object
      required: [investment_transactions, next_since, has_more]
      properties:
        investment_transactions:
          type: array
          items:
            $ref: '#/components/schemas/InvestmentTransaction'
        next_since:
          type: integer
          format: int64
          minimum: 0
          description: The largest `sync_version` in this page, or `since` when it is empty
        has_more:
          type: boolean

    # Sync -----------------------------------------------------------------------------------
    ChangeLogEntry:
      type: object
      description: >-
        Mirrors `shared_models` `ChangeLogEntry` without `synced`, which is local state.
        `payload` is the changed fields as JSON.
      additionalProperties: false
      required: [entity_type, entity_id, operation, payload, hlc, device_id]
      properties:
        entity_type:
          $ref: '#/components/schemas/EntityType'
        entity_id:
          type: string
        operation:
          $ref: '#/components/schemas/ChangeOperation'
        payload:
          type: object
          additionalProperties: true
        hlc:
          $ref: '#/components/schemas/Hlc'
        device_id:
          type: string
      example:
        entity_type: transaction
        entity_id: txn-7
        operation: update
        payload:
          notes: Dinner with Sam
        hlc: '001761300000000-00000-device-1'
        device_id: device-1
    PulledChangeLogEntry:
      type: object
      description: A `ChangeLogEntry` as pulled, with the server's `seq`.
      required: [entity_type, entity_id, operation, payload, hlc, device_id, seq]
      properties:
        entity_type:
          $ref: '#/components/schemas/EntityType'
        entity_id:
          type: string
        operation:
          $ref: '#/components/schemas/ChangeOperation'
        payload:
          type: object
          additionalProperties: true
        hlc:
          $ref: '#/components/schemas/Hlc'
        device_id:
          type: string
        seq:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
          description: The server's per-user order of arrival
      example:
        entity_type: transaction
        entity_id: txn-7
        operation: update
        payload:
          notes: Dinner with Sam
        hlc: '001761300000000-00000-device-2'
        device_id: device-2
        seq: 18
    PushRequest:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ChangeLogEntry'
    PushResult:
      type: object
      required: [accepted, rejected]
      properties:
        accepted:
          type: array
          items:
            $ref: '#/components/schemas/Hlc'
        rejected:
          type: array
          items:
            $ref: '#/components/schemas/RejectedEntry'
      example:
        accepted:
          - '001761300000000-00000-device-1'
        rejected: []
    RejectedEntry:
      type: object
      required: [hlc, reason]
      properties:
        hlc:
          $ref: '#/components/schemas/Hlc'
        reason:
          type: string
          description: Why the entry was not stored, for logs
    PullPage:
      type: object
      required: [entries, next_since, has_more]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/PulledChangeLogEntry'
        next_since:
          type: integer
          format: int64
          minimum: 0
          description: >-
            The largest `seq` this page covered, entries of the calling device included, or
            `since` when nothing new
        has_more:
          type: boolean

    # Webhooks and health --------------------------------------------------------------------
    PlaidWebhook:
      type: object
      description: A Plaid webhook body, verified before it is read
      additionalProperties: true
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: The contract version (`info.version`) the server implements
      example:
        status: ok
        version: 0.2.0
