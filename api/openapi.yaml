        - account_id
        - loan_name
        - guarantor
        - interest_rate_percentage
        - is_overdue
        - expected_payoff_date
        - last_payment_amount
        - last_payment_date
        - last_statement_balance
        - last_statement_issue_date
        - minimum_payment_amount
        - next_payment_due_date
        - origination_date
        - origination_principal_amount
        - outstanding_interest_amount
        - loan_status_type
        - repayment_plan_type
        - ytd_interest_paid
        - ytd_principal_paid
      properties:
        account_id:
          type: string
        loan_name:
          type: string
          nullable: true
        guarantor:
          type: string
          nullable: true
        interest_rate_percentage:
          $ref: '#/components/schemas/Decimal'
        is_overdue:
          type: boolean
          nullable: true
        expected_payoff_date:
          type: string
          format: date
          nullable: true
        last_payment_amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          nullable: true
        last_payment_date:
          type: string
          format: date
          nullable: true
        last_statement_balance:
          allOf:
            - $ref: '#/components/schemas/Money'
          nullable: true
        last_statement_issue_date:
