# Release: a pushed v* tag publishes a GitHub release by itself (docs/reference/testing-tools.md,
# **Cutting a release**). The gate runs first, with the same steps as ci.yml's, and nothing is
# published when it fails. The release job then checks that CHANGELOG.md has the tag's section,
# builds the demo debug APK and the prod release APK signed with the release key from the
# repository's secrets, refuses to go on unless apksigner reports the release certificate
# (tools/release/check_signature.sh), and creates the release with gh and the default token:
# the two APKs, the obfuscation symbols and a SHA256SUMS.txt as assets, the changelog section as
# the body, a pre-release when the tag has a suffix (v0.9.0-phase8, v1.0.0-rc.1). The keystore
# exists only as a temporary file for the build, removed whatever happens; no step prints a
# password or turns on tracing.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - id: fvm
        run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          channel: stable
          cache: true
      - run: tools/gates.sh
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures
          path: app/test/**/failures/**
          if-no-files-found: ignore
          retention-days: 14

  release:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - id: fvm
        run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          channel: stable
          cache: true
      # First, so a tag without its changelog section fails before anything is built.
      - name: Write the release notes
        run: tools/release/release_notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
      - name: Build the demo debug APK
        working-directory: app
        run: flutter build apk --debug --flavor demo -t lib/main_demo.dart
      - name: Decode the release keystore
        env:
          FT_RELEASE_KEYSTORE_BASE64: ${{ secrets.FT_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$FT_RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::the FT_RELEASE_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          printf '%s' "$FT_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build the prod release APK
        working-directory: app
        env:
          FT_RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
          FT_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.FT_RELEASE_KEYSTORE_PASSWORD }}
          FT_RELEASE_KEY_ALIAS: ${{ secrets.FT_RELEASE_KEY_ALIAS }}
          FT_RELEASE_KEY_PASSWORD: ${{ secrets.FT_RELEASE_KEY_PASSWORD }}
        run: >-
          flutter build apk --release --flavor prod -t lib/main_prod.dart
          --obfuscate --split-debug-info=build/symbols
      - name: Check the release signature
        run: tools/release/check_signature.sh app/build/app/outputs/flutter-apk/app-prod-release.apk
      - name: Collect the assets
        run: |
          mkdir dist
          cp app/build/app/outputs/flutter-apk/app-prod-release.apk "dist/spendthrift-$TAG-prod-release.apk"
          cp app/build/app/outputs/flutter-apk/app-demo-debug.apk "dist/spendthrift-$TAG-demo-debug.apk"
          tar -czf "dist/spendthrift-$TAG-symbols.tar.gz" -C app/build symbols
          (cd dist && sha256sum spendthrift-* > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
