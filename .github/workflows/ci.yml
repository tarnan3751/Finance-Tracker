# CI: the gate on every push and pull request, then the demo debug APK as an artifact and
# the prod release build as the R8 and obfuscation canary, and the contract job: the
# OpenAPI document validated by openapi-generator itself and the committed client proved
# current by regenerating it. The Flutter version comes from .fvmrc, so CI runs the same
# SDK as every lane. The signed release-on-tag workflow is Phase 9.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - id: fvm
        run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          channel: stable
          cache: true
      - run: tools/gates.sh

  apk:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - id: fvm
        run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          channel: stable
          cache: true
      - name: Build the demo debug APK
        working-directory: app
        run: flutter build apk --debug --flavor demo -t lib/main_demo.dart
      - uses: actions/upload-artifact@v7
        with:
          name: finance-tracker-demo-debug
          path: app/build/app/outputs/flutter-apk/app-demo-debug.apk
          retention-days: 14
      - name: Build the prod release APK (R8 and obfuscation canary)
        working-directory: app
        run: >-
          flutter build apk --release --flavor prod -t lib/main_prod.dart
          --obfuscate --split-debug-info=build/symbols

  contract:
    needs: gate
    runs-on: ubuntu-latest
    env:
      OPENAPI_GENERATOR_VERSION: 7.26.0
      # SHA-256 of openapi-generator-cli-7.26.0.jar from Maven Central (also the jar in the
      # Homebrew bottle the lanes use).
      OPENAPI_GENERATOR_SHA256: 1760050094997b9cc790cc1350be095f15da8c08a996b184d3eadc4ccda5e35e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - id: fvm
        run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          channel: stable
          cache: true
      - name: Fetch openapi-generator
        run: |
          jar="$RUNNER_TEMP/openapi-generator-cli-$OPENAPI_GENERATOR_VERSION.jar"
          curl -sSfL -o "$jar" "https://repo1.maven.org/maven2/org/openapitools/openapi-generator-cli/$OPENAPI_GENERATOR_VERSION/openapi-generator-cli-$OPENAPI_GENERATOR_VERSION.jar"
          echo "$OPENAPI_GENERATOR_SHA256  $jar" | sha256sum -c -
          echo "OPENAPI_GENERATOR=java -jar $jar" >> "$GITHUB_ENV"
      - name: Validate the contract
        run: $OPENAPI_GENERATOR validate -i api/openapi.yaml
      - name: Check the generated client is current
        run: tools/gen_api_client.sh --check
