# The pub workspace: one dependency resolution and one pubspec.lock for the app, the server
# and the shared packages (CLAUDE.md, **Folder layout**). Members declare
# `resolution: workspace` and carry no lock file of their own.
name: finance_tracker_workspace
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - app
  - server
  - packages/shared_models
  - packages/api_client
  - packages/contract_test
  - packages/sync_engine
  - tools/persona_engine

# The sqlite3 package's build hook bundles SQLite3 Multiple Ciphers instead of plain SQLite,
# so the app's database is encrypted at rest (PLAN.md §12; docs/reference/data.md).
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
