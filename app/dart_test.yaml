# Test tags. `golden` marks the alchemist golden tests (test/flutter_test_config.dart);
# run only them with `flutter test --tags golden`, or skip them with `--exclude-tags golden`.
tags:
  golden:
  # The recurring detector measured against the persona engine's expectations
  # (test/features/recurring/domain/detector_harness_test.dart); the gate runs it, and
  # `flutter test --tags detector_harness` runs it alone with its figures.
  detector_harness:
  # The anomaly flags measured against the persona engine's planted anomalies
  # (test/features/reports/domain/anomaly_harness_test.dart); the gate runs it, and
  # `flutter test --tags anomaly_harness` runs it alone with its figures.
  anomaly_harness:
  # The full seeded random runs of the convergence test
  # (test/sync/two_device_convergence_test.dart): every seed of each run, where the gate
  # runs the first five. Skipped unless asked for:
  # `flutter test --run-skipped --tags convergence_full test/sync/` runs them alone.
  convergence_full:
    skip: "the full convergence runs: flutter test --run-skipped --tags convergence_full test/sync/"
