name: finance_tracker
description: An Android personal finance app with bank data, budgets, bills and net worth.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  api_client:
    path: ../packages/api_client
  # The generated client's models are built_value classes.
  built_value: ^8.13.0
  # Whether a network is up (BSD-3), behind core/platform/connectivity.dart: sync runs again
  # when one returns after a failure. Pinned exactly.
  connectivity_plus: 7.3.2
  # SHA-256 for the in-app fake server's password hashes (core/api/fake/) and the backup.
  crypto: ^3.0.7
  # The backup's key and frames (Apache-2.0, pure Dart): Argon2id, HKDF-SHA256 and
  # XChaCha20-Poly1305 (features/backup/domain/). Pinned exactly: the archive format rests
  # on its output, so a new release is taken deliberately.
  cryptography: 2.9.0
  device_info_plus: ^13.3.0
  dio: ^5.11.0
  # drift, drift_dev and sqlite3 are held to releases at least two weeks old (the versions
  # published on 2026-10-23 are excluded); lift the caps with the next band move.
  drift: ">=2.35.1 <2.35.3"
  dynamic_color: ">=1.9.0 <2.0.0"
  # The forecast chart (MIT). Pinned exactly: 1.3.0 was published under two weeks ago.
  fl_chart: 1.2.0
  flutter:
    sdk: flutter
  # The export's "Save as" through the Storage Access Framework (BSD-3), behind
  # core/platform/file_exporter.dart, used by dev and prod. Pinned exactly.
  flutter_file_dialog: 3.3.3
  # Bill reminders (BSD-3), behind core/platform/reminder_scheduler.dart, used by dev and
  # prod. Pinned exactly: 22.3.3 was published on 2026-10-25, under two weeks ago.
  flutter_local_notifications: 22.3.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  # Android: AES-GCM keys wrapped by a Keystore RSA key; the database key lives here.
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  go_router: ^17.5.0
  # Receipt photos (BSD-3), behind core/platform/image_source.dart, used by dev and prod.
  # The home screen widgets (BSD-3), behind features/widgets/domain/widget_writer.dart and
  # core/platform/launch_intent.dart, in every flavor: the snapshot store, the update
  # broadcast and the widget taps. RemoteViews only; the plugin carries Glance for its own
  # code, the app adds no Compose. Pinned exactly.
  home_widget: 0.10.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  # The app lock's biometric or device-credential prompt (BSD-3), behind
  # features/lock/domain/device_auth.dart. Pinned exactly.
  local_auth: 3.0.2
  logging: ^1.3.0
  package_info_plus: ^10.2.2
  path: ^1.9.0
  path_provider: ^2.1.6
  # The monthly report's PDF (Apache-2.0, pure Dart). Pinned exactly: its bytes are pinned
  # by a hash golden, so a new release is taken deliberately.
  pdf: 3.13.1
  # The demo flavor's data: the persona engine's demo seed, generated at startup.
  persona_engine:
    path: ../tools/persona_engine
  # Plaid Link (MIT), behind the items feature's LinkLauncher, used by dev and prod.
  plaid_flutter: 5.2.1
  # The app shortcuts (BSD-3), dynamic ones set from Dart with ARB titles, behind
  # core/platform/app_shortcuts.dart and core/platform/launch_intent.dart. Pinned exactly.
  quick_actions: 1.1.1
  riverpod_annotation: 4.0.7
  # The export's Share (BSD-3), behind core/platform/file_exporter.dart, used by dev and
  # prod. Pinned exactly.
  share_plus: 13.3.1
  shared_models:
    path: ../packages/shared_models
  # Unused by the app itself since the legacy UI went; the Phase 1 legacy importer reads
  # the original app's `transactions`, `incomes` and `totalBalance` keys through it.
  shared_preferences: ^2.5.6
  # The native library comes from this package's build hook, which the workspace root's
  # `hooks: user_defines` sets to SQLite3 Multiple Ciphers (encryption at rest).
  sqlite3: ">=3.7.0 <3.8.0"
  sync_engine:
    path: ../packages/sync_engine
  timezone: ^0.11.1
  uuid: ^4.6.0
  # Background sync through Android's WorkManager (MIT), behind
  # core/platform/background_work.dart, used by dev and prod. Pinned exactly: 0.10.10 carries
  # the AGP 9 build and the Android 16 fixes.
  workmanager: 0.10.10

dev_dependencies:
  alchemist: ^0.14.1
  # 2.16.2 needs analyzer 14, which the workspace cannot reach: Flutter pins test_api
  # 0.7.12, so the server's `test` stops at 1.31.1, which caps analyzer below 14.
  build_runner: 2.16.1
  contract_test:
    path: ../packages/contract_test
  drift_dev: ">=2.35.1 <2.35.2"
  # Only holds image_picker's transitive macOS file selector to a release older than two
  # weeks (0.9.5+2 was published on 2026-10-19); lift it with the next band move.
  file_selector_macos: ">=0.9.5 <0.9.5+2"
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.5.0
  # Only holds image_picker's transitive iOS implementation to a release older than two
  # weeks (0.8.13+12 and +13 were published on 2026-10-14 and 2026-10-22); lift it with
  # the next band move.
  image_picker_ios: ">=0.8.13 <0.8.13+11"
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  # Only holds image's transitive posix to a release older than two weeks (6.5.3 and 6.5.4
  # were published on 2026-10-25 and 2026-10-28); lift it with the next band move.
  posix: ">=6.5.0 <6.5.3"
  # Only holds pdf's transitive qr to a release older than two weeks (3.0.3 was published
  # on 2026-10-29); lift it with the next band move.
  qr: ">=3.0.0 <3.0.3"
  riverpod_generator: 4.0.9
  # Only holds drift_dev's transitive sqlparser to a release older than two weeks (0.45.1 was
  # published on 2026-10-23); lift it with the next band move.
  sqlparser: ">=0.45.0 <0.45.1"

flutter:
  generate: true
  uses-material-design: true
  assets:
    # Roboto Regular and Bold (Apache-2.0, LICENSE.txt beside them), embedded in the
    # monthly report's PDF (features/export/).
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
    # The demo flavor's receipt photo (a synthetic one), for its fake image source.
    - path: assets/demo/receipt.jpg
      flavors:
        - demo
