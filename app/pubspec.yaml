name: finance_tracker
description: An Android personal finance app with bank data, budgets, bills and net worth.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  dynamic_color: ">=1.9.0 <2.0.0"
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.1
  go_router: ^17.5.0
  intl: ^0.20.3
  logging: ^1.3.0
  package_info_plus: ^10.2.2
  riverpod_annotation: 4.0.7
  # Unused by the app itself since the legacy UI went; the Phase 1 legacy importer reads
  # the original app's `transactions`, `incomes` and `totalBalance` keys through it.
  shared_preferences: ^2.5.6
  timezone: ^0.11.1

dev_dependencies:
  alchemist: ^0.14.1
  # 2.16.2 needs analyzer 14, which the workspace cannot reach: Flutter pins test_api
  # 0.7.12, so the server's `test` stops at 1.31.1, which caps analyzer below 14.
  build_runner: 2.16.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.5.0
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  riverpod_generator: 4.0.9

flutter:
  uses-material-design: true
